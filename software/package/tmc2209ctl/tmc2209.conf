# tmc2209ctl defaults - applied by "tmc2209ctl -m all init" at boot.
# Command-line options (-d, -a, -b) override these.
#
# Keys before the first [motorN] section apply to every motor; keys inside
# a section override them for that motor only.

# UART1 on P9_24 (TX) / P9_26 (RX), wired single-wire to the PDN_UART pin
# of BOTH drivers (one shared bus, told apart by the address)
device = /dev/ttyS1
baud = 115200

# Motor RMS run current in mA. Check your motor's rated current and
# start LOW (a typical NEMA17 is 1.0-1.7 A peak; RMS = peak / 1.41).
current_ma = 600
# Standstill current as percent of run current
hold_percent = 50
microsteps = 16
# stealthchop (quiet) or spreadcycle (more torque at speed)
mode = stealthchop
invert_dir = 0

# 200 for 1.8 degree motors, 400 for 0.9 degree
steps_per_rev = 200
# default speed (rpm) and acceleration (rev/s^2) for turn/move/run
rpm = 60
accel = 2

# UART address = MS1 + 2 * MS2   (pin to GND = 0, pin to 3.3V = 1)
# GPIO line names come from the BeagleBone Black device tree.
#
# Endstops: a switch from endstop_line to GND, internal pull-up.
# endstop_nc = 0: switch wired COM/NO (line reads 0 when pressed)
# endstop_nc = 1: switch wired COM/NC (line reads 1 when pressed; a broken
#                 wire then reads as pressed, which is the safe side)
#
# Homing ("tmc2209ctl home"): each joint turns toward its switch, backs
# off 5 degrees and comes back slowly (home_rpm / 5).
# home_dir = 1 if "tmc2209ctl -m N turn 0.1" moves the joint TOWARD the
#            switch, -1 if it moves away.  0 = not checked yet: homing
#            refuses to run.  Flip it if you ever change invert_dir.
# home_angle = joint angle (deg) when the switch clicks, measured with
#            "scara jog" (see readme.txt).  Angles: shoulder from the +X
#            axis, elbow from the line of link 1 (0 = straight),
#            counter-clockwise positive seen from above.
# min_angle / max_angle = safe joint range (deg) for "scara joint";
#            both 0 = not measured yet: "scara joint" refuses to run.
# motor_teeth / joint_teeth = GT2 pulley teeth; the travel limit (one
#            joint revolution) and the back-off are in joint degrees.
# home_rpm = homing speed in motor rpm.
home_rpm = 20

[motor1]
# MS1 = GND, MS2 = GND
address = 0
step_line = P9_16 [ehrpwm1b]
dir_line = P9_18 [spi0_d1]
endstop_line = P9_14 [ehrpwm1a]
endstop_nc = 0
# shoulder
home_dir = 1
home_angle = 116.75
motor_teeth = 20
joint_teeth = 72
min_angle = -109.25
max_angle = 111.75

[motor2]
# MS1 = GND, MS2 = 3.3V
address = 2
# Not P9_28: it stays high even when driven low (see the device tree)
step_line = P9_12
dir_line = P9_30 [spi1_d1]
endstop_line = P9_22 [spi0_sclk]
endstop_nc = 0
# elbow
home_dir = 1
home_angle = 171
motor_teeth = 20
joint_teeth = 45
min_angle = -171
max_angle = 166
