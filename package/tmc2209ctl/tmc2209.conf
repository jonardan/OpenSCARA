# tmc2209ctl defaults - applied by "tmc2209ctl -m all init" at boot.
# Command-line options (-d, -a, -b) override these.
#
# Keys before the first [motorN] section apply to every motor; keys inside
# a section override them for that motor only.

# UART1 on P9_24 (TX) / P9_26 (RX), wired single-wire to the PDN_UART pin
# of BOTH drivers (one shared bus, told apart by the address)
device = /dev/ttyS1
baud = 115200

# Motor RMS run current in mA. Check your motor's rated current and
# start LOW (a typical NEMA17 is 1.0-1.7 A peak; RMS = peak / 1.41).
current_ma = 600
# Standstill current as percent of run current
hold_percent = 50
microsteps = 16
# stealthchop (quiet) or spreadcycle (more torque at speed)
mode = stealthchop
invert_dir = 0

# 200 for 1.8 degree motors, 400 for 0.9 degree
steps_per_rev = 200
# default speed (rpm) and acceleration (rev/s^2) for turn/move/run
rpm = 60
accel = 2

# UART address = MS1 + 2 * MS2   (pin to GND = 0, pin to 3.3V = 1)
# GPIO line names come from the BeagleBone Black device tree.

[motor1]
# MS1 = GND, MS2 = GND
address = 0
step_line = P9_16 [ehrpwm1b]
dir_line = P9_18 [spi0_d1]

[motor2]
# MS1 = GND, MS2 = 3.3V
address = 2
# P9_28 is free only because HDMI audio is disabled in the device tree
step_line = P9_28 [spi1_cs0]
dir_line = P9_30 [spi1_d1]
